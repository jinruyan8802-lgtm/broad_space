services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-broadspace}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-broadspace}
      POSTGRES_DB: ${DB_NAME:-broadspace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-broadspace} -d ${DB_NAME:-broadspace}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  miniflux:
    image: miniflux/miniflux:latest
    environment:
      DATABASE_URL: postgres://${DB_USER:-broadspace}:${DB_PASSWORD:-broadspace}@postgres/${DB_NAME:-broadspace}?sslmode=disable
      RUN_MIGRATIONS: 1
      CREATE_ADMIN: 1
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/miniflux", "-healthcheck", "auto"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-broadspace}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-broadspace}
      DB_PASSWORD: ${DB_PASSWORD:-broadspace}
      DB_NAME: ${DB_NAME:-broadspace}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://localhost:1234/v1}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-broadspace}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  delivery:
    build:
      context: ./delivery
      dockerfile: Dockerfile
    container_name: broadspace-delivery
    environment:
      API_URL: http://api:8000
      DELIVERY_HEALTH_PORT: 8081
      DB_HOST: postgres
      DB_USER: ${DB_USER:-broadspace}
      DB_PASSWORD: ${DB_PASSWORD:-broadspace}
      DB_NAME: ${DB_NAME:-broadspace}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-broadspace@example.com}
      TO_EMAILS: ${TO_EMAILS:-}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
