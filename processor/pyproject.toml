[project]
name = "broadspace-processor"
version = "0.1.0"
description = "BroadSpace content processing pipeline"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.28.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "factory-boy>=3.3.0",
]