<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>BroadSpace Daily Digest</title></head>
<body style="font-family: Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px;">
  <h1 style="border-bottom: 2px solid #333; padding-bottom: 10px;">
    BroadSpace Daily Digest — {{date}}
  </h1>
  {% for a in articles %}
  <div style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #eee;">
    <h3 style="margin: 0 0 8px 0;">{{badge(a.signal_strength)}} {{a.title}}</h3>
    <p style="color: #555; margin: 0 0 8px 0;">{{a.summary}}</p>
    <small style="color: #999;">
      Signal: <strong>{{a.signal_strength}}</strong> |
      Categories: {{a.categories|join(', ')}} |
      Sentiment: {{a.sentiment}}
    </small>
  </div>
  {% endfor %}
</body>
</html>
